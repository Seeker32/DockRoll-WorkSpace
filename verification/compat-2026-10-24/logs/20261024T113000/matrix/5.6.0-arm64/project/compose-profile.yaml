# Profile behavior sample: `extra` must only start when its profile is enabled.
services:
  base:
    image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sh", "-c", "sleep 60"]
  extra:
    image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sh", "-c", "sleep 60"]
    profiles: ["debug"]
